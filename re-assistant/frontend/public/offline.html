<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RE-Assistent — Offline</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#07070f;color:#eeeef8;font-family:system-ui,sans-serif;text-align:center;padding:24px}
    .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
          border-radius:20px;padding:40px 32px;max-width:420px;width:100%}
    .icon{font-size:52px;margin-bottom:16px}
    h1{font-size:22px;font-weight:700;margin-bottom:8px}
    p{font-size:14px;color:#8888a8;line-height:1.6;margin-bottom:20px}
    button{background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.4);border-radius:10px;
           color:#a855f7;font-size:14px;font-weight:600;padding:11px 24px;cursor:pointer;
           transition:all .15s;font-family:inherit}
    button:hover{background:rgba(168,85,247,.3)}
    .status{font-size:12px;color:#3e3e58;margin-top:16px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
         background:#fbbf24;margin-right:6px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>RE-Assistent ist offline</h1>
    <p>Die Verbindung zum Server wurde unterbrochen. Gecachte Daten sind weiterhin lesbar — Änderungen werden synchronisiert sobald die Verbindung wiederhergestellt ist.</p>
    <button onclick="location.reload()">🔄 Erneut versuchen</button>
    <div class="status"><span class="dot"></span>Warte auf Verbindung …</div>
  </div>
  <script>
    // Auto-reload wenn wieder online
    window.addEventListener('online', () => location.reload());
    setInterval(() => {
      fetch('/api/version').then(() => location.reload()).catch(() => {});
    }, 10000);
  </script>
</body>
</html>
