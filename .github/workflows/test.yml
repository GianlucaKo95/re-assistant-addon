name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/package.json'
      
      - name: Install backend dependencies
        run: |
          cd re-assistant/backend
          npm install
      
      - name: Install frontend dependencies & build
        run: |
          cd re-assistant/frontend
          npm install
          npm run build
      
      - name: Start backend
        run: |
          cd re-assistant/backend
          NODE_ENV=test \
          DATA_DIR=/tmp/re-test-data \
          ADMIN_PASSWORD=admin123 \
          PORT=3001 \
          node server.js &
          echo "Waiting for backend..."
          sleep 3
          curl -f http://localhost:3001/api/version || exit 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test' }}
      
      - name: Install Playwright
        run: |
          cd tests
          npm install
          npx playwright install chromium --with-deps
      
      - name: Run E2E tests
        run: |
          cd tests
          BASE_URL=http://localhost:3001 npx playwright test
        env:
          CI: true
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
